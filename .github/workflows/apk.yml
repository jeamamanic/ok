name: Crear APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SaltaCanciones-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SaltaCanciones.apk
          gh release create v1.3 SaltaCanciones.apk --target "$GITHUB_SHA" --title "Salta Canciones 1.3" --notes "APK de prueba para Android 8 o superior."
